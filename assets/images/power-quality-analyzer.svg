<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2533"/>
      <stop offset="50%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#0e141e"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a384c"/>
      <stop offset="100%" stop-color="#18202d"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040d16"/>
      <stop offset="100%" stop-color="#02080d"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#189ED6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#27BCAE" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#189ED6"/>
      <stop offset="50%" stop-color="#27BCAE"/>
      <stop offset="100%" stop-color="#3AC67D"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Drop Shadow / Floor Glow -->
  <ellipse cx="300" cy="385" rx="260" ry="12" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="378" rx="200" ry="8" fill="#189ED6" opacity="0.15"/>

  <!-- Instrument Chassis / Casing -->
  <rect x="50" y="25" width="500" height="345" rx="20" fill="url(#bodyGrad)" stroke="#32445a" stroke-width="2"/>
  <!-- Corner Bumpers (Ruggedized industrial rubber guards) -->
  <path d="M50 45 Q50 25 70 25 L85 25 Q55 35 55 65 Z" fill="#27BCAE" opacity="0.85"/>
  <path d="M550 45 Q550 25 530 25 L515 25 Q545 35 545 65 Z" fill="#27BCAE" opacity="0.85"/>
  <path d="M50 350 Q50 370 70 370 L85 370 Q55 360 55 330 Z" fill="#27BCAE" opacity="0.85"/>
  <path d="M550 350 Q550 370 530 370 L515 370 Q545 360 545 330 Z" fill="#27BCAE" opacity="0.85"/>

  <!-- Handle bar top -->
  <rect x="180" y="14" width="240" height="11" rx="5" fill="#243346" stroke="#3d516b" stroke-width="1.5"/>

  <!-- Top Status Bar & Nexovolt Branding -->
  <text x="75" y="52" fill="#edf5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="2">NEXO<tspan fill="#27BCAE">VOLT</tspan></text>
  <text x="175" y="52" fill="#7d93ac" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">PQA-8000 CLASS-A POWER ANALYZER</text>
  
  <!-- LED indicators -->
  <circle cx="490" cy="48" r="4" fill="#3AC67D" filter="url(#subtleGlow)"/>
  <text x="475" y="41" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="8" font-weight="700">REC</text>
  <circle cx="520" cy="48" r="4" fill="#189ED6" filter="url(#subtleGlow)"/>
  <text x="509" y="41" fill="#189ED6" font-family="system-ui, sans-serif" font-size="8" font-weight="700">SYNC</text>

  <!-- Main Screen Outer Frame -->
  <rect x="70" y="65" width="460" height="235" rx="10" fill="url(#bezelGrad)" stroke="#1f2c3d" stroke-width="2"/>
  <!-- Screen Glass -->
  <rect x="76" y="71" width="448" height="223" rx="6" fill="url(#screenGrad)"/>
  <rect x="76" y="71" width="448" height="223" rx="6" fill="url(#screenGlow)"/>

  <!-- Oscilloscope Grid Lines -->
  <!-- Horizontal Grid -->
  <line x1="86" y1="91" x2="514" y2="91" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="86" y1="117" x2="514" y2="117" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="86" y1="143" x2="514" y2="143" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="86" y1="169" x2="514" y2="169" stroke="#189ED6" stroke-opacity="0.25"/> <!-- Center X -->
  <line x1="86" y1="195" x2="514" y2="195" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="86" y1="221" x2="514" y2="221" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="86" y1="247" x2="514" y2="247" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>

  <!-- Vertical Grid -->
  <line x1="128" y1="81" x2="128" y2="265" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="180" y1="81" x2="180" y2="265" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="232" y1="81" x2="232" y2="265" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="284" y1="81" x2="284" y2="265" stroke="#189ED6" stroke-opacity="0.25"/> <!-- Center Y -->
  <line x1="336" y1="81" x2="336" y2="265" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="388" y1="81" x2="388" y2="265" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>
  <line x1="440" y1="81" x2="440" y2="265" stroke="#189ED6" stroke-opacity="0.12" stroke-dasharray="2,3"/>

  <!-- Waveform 1: Clean Sine Wave (Mitigated / Pure Reference) -->
  <path d="M 86 169 Q 122 75, 158 169 T 230 169 T 302 169 T 374 169 T 446 169 T 514 169" 
        fill="none" stroke="url(#wave1)" stroke-width="3" filter="url(#glow)"/>

  <!-- Waveform 2: Distorted Industrial Harmonic Wave (3rd + 5th Harmonic Distortion) -->
  <path d="M 86 169 
           C 96 110, 106 125, 122 105 
           C 138 85, 148 135, 158 169 
           C 168 203, 178 253, 194 233 
           C 210 213, 220 228, 230 169 
           C 240 110, 250 125, 266 105 
           C 282 85, 292 135, 302 169 
           C 312 203, 322 253, 338 233 
           C 354 213, 364 228, 374 169 
           C 384 110, 394 125, 410 105 
           C 426 85, 436 135, 446 169 
           C 456 203, 466 253, 482 233 
           C 498 213, 508 228, 514 169" 
        fill="none" stroke="url(#wave2)" stroke-width="2" stroke-dasharray="5,2" opacity="0.85"/>

  <!-- On-Screen Telemetry Dashboard Overlays -->
  <!-- Top Left: Live Real-Time Metrics -->
  <rect x="88" y="80" width="128" height="42" rx="4" fill="#071522" fill-opacity="0.85" stroke="#189ED6" stroke-width="0.8"/>
  <text x="96" y="95" fill="#189ED6" font-family="system-ui, monospace" font-size="9" font-weight="700">V_RMS: 415.2 V</text>
  <text x="96" y="107" fill="#3AC67D" font-family="system-ui, monospace" font-size="9" font-weight="700">FREQ:  50.02 Hz</text>
  <text x="96" y="118" fill="#27BCAE" font-family="system-ui, monospace" font-size="8" font-weight="700">PF: 0.99 (COMP)</text>

  <!-- Top Right: THD Distortion Stats -->
  <rect x="382" y="80" width="132" height="42" rx="4" fill="#071522" fill-opacity="0.85" stroke="#27BCAE" stroke-width="0.8"/>
  <text x="390" y="95" fill="#ef4444" font-family="system-ui, monospace" font-size="9" font-weight="700">THD-V (RAW): 11.4%</text>
  <text x="390" y="107" fill="#3AC67D" font-family="system-ui, monospace" font-size="9" font-weight="700">THD-V (FLT):  1.8%</text>
  <text x="390" y="118" fill="#9db0c5" font-family="system-ui, monospace" font-size="8" font-weight="600">IEEE-519 COMPLIANT</text>

  <!-- Bottom Harmonic Spectrum Bar Graph on screen -->
  <g transform="translate(90, 240)">
    <rect x="0" y="0" width="420" height="46" rx="4" fill="#030c14" fill-opacity="0.9" stroke="#1e3044" stroke-width="0.8"/>
    <text x="10" y="14" fill="#7a92ab" font-family="system-ui, sans-serif" font-size="8" font-weight="700">HARMONIC ORDER (h1 - h25)</text>
    
    <!-- Spectrum Bars -->
    <rect x="10" y="18" width="6" height="24" fill="#3AC67D"/> <!-- Fundamental 100% -->
    <rect x="22" y="38" width="6" height="4" fill="#189ED6"/>  <!-- 2nd -->
    <rect x="34" y="26" width="6" height="16" fill="#f59e0b"/> <!-- 3rd -->
    <rect x="46" y="40" width="6" height="2" fill="#189ED6"/>  <!-- 4th -->
    <rect x="58" y="22" width="6" height="20" fill="#ef4444"/> <!-- 5th prominent -->
    <rect x="70" y="39" width="6" height="3" fill="#189ED6"/>  <!-- 6th -->
    <rect x="82" y="28" width="6" height="14" fill="#f59e0b"/> <!-- 7th -->
    <rect x="94" y="40" width="6" height="2" fill="#189ED6"/>
    <rect x="106" y="32" width="6" height="10" fill="#27BCAE"/> <!-- 9th -->
    <rect x="118" y="34" width="6" height="8" fill="#27BCAE"/>  <!-- 11th -->
    <rect x="130" y="36" width="6" height="6" fill="#27BCAE"/>  <!-- 13th -->
    
    <text x="210" y="26" fill="#edf5ff" font-family="system-ui, monospace" font-size="10" font-weight="700">REAL-TIME FFT DIAGNOSIS</text>
    <text x="210" y="38" fill="#27BCAE" font-family="system-ui, monospace" font-size="8">50 Hz Fundamental Locked</text>
  </g>

  <!-- Bottom Instrument Control Deck / Terminals -->
  <!-- 4 BNC / Binding Post Terminals (L1, L2, L3, Neutral/Earth) -->
  <g transform="translate(90, 316)">
    <!-- Terminal 1: L1 Red -->
    <circle cx="20" cy="18" r="14" fill="#1b2432" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="20" cy="18" r="6" fill="#3b1111"/>
    <circle cx="20" cy="18" r="3" fill="#ef4444"/>
    <text x="14" y="44" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="800">L1</text>

    <!-- Terminal 2: L2 Yellow -->
    <circle cx="65" cy="18" r="14" fill="#1b2432" stroke="#eab308" stroke-width="2.5"/>
    <circle cx="65" cy="18" r="6" fill="#332a07"/>
    <circle cx="65" cy="18" r="3" fill="#eab308"/>
    <text x="59" y="44" fill="#eab308" font-family="system-ui, sans-serif" font-size="9" font-weight="800">L2</text>

    <!-- Terminal 3: L3 Blue -->
    <circle cx="110" cy="18" r="14" fill="#1b2432" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="110" cy="18" r="6" fill="#0d2447"/>
    <circle cx="110" cy="18" r="3" fill="#3b82f6"/>
    <text x="104" y="44" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" font-weight="800">L3</text>

    <!-- Terminal 4: Neutral -->
    <circle cx="155" cy="18" r="14" fill="#1b2432" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="155" cy="18" r="6" fill="#1e293b"/>
    <circle cx="155" cy="18" r="3" fill="#94a3b8"/>
    <text x="151" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">N</text>
  </g>

  <!-- Rotary Encoder / Navigation Dial -->
  <g transform="translate(380, 312)">
    <circle cx="30" cy="22" r="20" fill="#222e40" stroke="#3a4d66" stroke-width="2"/>
    <circle cx="30" cy="22" r="14" fill="#151d28"/>
    <circle cx="30" cy="12" r="2.5" fill="#27BCAE"/>
    <text x="60" y="26" fill="#9db0c5" font-family="system-ui, sans-serif" font-size="9" font-weight="700">NAV / CAL</text>
  </g>

  <!-- Quick Action Buttons -->
  <g transform="translate(470, 320)">
    <rect x="0" y="0" width="22" height="12" rx="3" fill="#1e2c3d" stroke="#32465e" stroke-width="1"/>
    <rect x="28" y="0" width="22" height="12" rx="3" fill="#27BCAE" opacity="0.9"/>
    <text x="32" y="9" fill="#02111d" font-family="system-ui, sans-serif" font-size="7" font-weight="900">RUN</text>
    <rect x="0" y="16" width="22" height="12" rx="3" fill="#1e2c3d" stroke="#32465e" stroke-width="1"/>
    <rect x="28" y="16" width="22" height="12" rx="3" fill="#1e2c3d" stroke="#32465e" stroke-width="1"/>
  </g>
</svg>