<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#243346"/>
      <stop offset="50%" stop-color="#3b526f"/>
      <stop offset="100%" stop-color="#182330"/>
    </linearGradient>
    <linearGradient id="bushingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="coronaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky / Industrial Background with Substation Grid -->
  <rect x="0" y="0" width="600" height="450" rx="14" fill="url(#subGrad)"/>
  
  <!-- Subtle High-Voltage Grid & Transmission Tower Silhouettes in background -->
  <g stroke="#1e2e42" stroke-width="1.2" opacity="0.4">
    <!-- Pylon structure left -->
    <line x1="80" y1="40" x2="40" y2="350"/>
    <line x1="80" y1="40" x2="120" y2="350"/>
    <line x1="50" y1="120" x2="110" y2="120"/>
    <line x1="45" y1="200" x2="115" y2="200"/>
    <line x1="40" y1="280" x2="120" y2="280"/>
    <line x1="50" y1="120" x2="115" y2="200"/>
    <line x1="110" y1="120" x2="45" y2="200"/>

    <!-- Pylon structure right -->
    <line x1="520" y1="40" x2="480" y2="350"/>
    <line x1="520" y1="40" x2="560" y2="350"/>
    <line x1="490" y1="120" x2="550" y2="120"/>
    <line x1="485" y1="200" x2="555" y2="200"/>
    <line x1="480" y1="280" x2="560" y2="280"/>

    <!-- High voltage overhead catenary lines -->
    <path d="M 0 60 Q 300 110, 600 60" fill="none"/>
    <path d="M 0 80 Q 300 130, 600 80" fill="none"/>
    <path d="M 0 100 Q 300 150, 600 100" fill="none"/>
  </g>

  <!-- Substation Concrete Foundation / Ground Plane -->
  <polygon points="40,360 560,360 580,430 20,430" fill="#0f1722" stroke="#253549" stroke-width="1.5"/>
  <line x1="20" y1="360" x2="580" y2="360" stroke="#33475e" stroke-width="2"/>
  <!-- Gravel Texture Lines -->
  <line x1="60" y1="380" x2="90" y2="380" stroke="#223347" stroke-width="1.5"/>
  <line x1="120" y1="400" x2="160" y2="400" stroke="#223347" stroke-width="1.5"/>
  <line x1="440" y1="385" x2="480" y2="385" stroke="#223347" stroke-width="1.5"/>
  <line x1="500" y1="405" x2="540" y2="405" stroke="#223347" stroke-width="1.5"/>

  <!-- CENTRAL STEP-DOWN TRANSFORMER (33kV / 415V Heavy Duty Industrial Unit) -->
  <g transform="translate(180, 150)">
    <!-- Main Oil Tank Body -->
    <rect x="0" y="70" width="240" height="150" rx="8" fill="url(#tankGrad)" stroke="#476282" stroke-width="2"/>
    
    <!-- Radiator Cooling Fins Left -->
    <g fill="#1a2533" stroke="#2c3e54" stroke-width="1">
      <rect x="-35" y="80" width="30" height="130" rx="3"/>
      <line x1="-35" y1="100" x2="-5" y2="100"/>
      <line x1="-35" y1="120" x2="-5" y2="120"/>
      <line x1="-35" y1="140" x2="-5" y2="140"/>
      <line x1="-35" y1="160" x2="-5" y2="160"/>
      <line x1="-35" y1="180" x2="-5" y2="180"/>
      <line x1="-35" y1="200" x2="-5" y2="200"/>
    </g>

    <!-- Radiator Cooling Fins Right -->
    <g fill="#1a2533" stroke="#2c3e54" stroke-width="1">
      <rect x="245" y="80" width="30" height="130" rx="3"/>
      <line x1="245" y1="100" x2="275" y2="100"/>
      <line x1="245" y1="120" x2="275" y2="120"/>
      <line x1="245" y1="140" x2="275" y2="140"/>
      <line x1="245" y1="160" x2="275" y2="160"/>
      <line x1="245" y1="180" x2="275" y2="180"/>
      <line x1="245" y1="200" x2="275" y2="200"/>
    </g>

    <!-- Conservator Tank on top -->
    <rect x="30" y="30" width="130" height="32" rx="14" fill="#2d3f54" stroke="#486280" stroke-width="1.5"/>
    <line x1="80" y1="62" x2="80" y2="70" stroke="#486280" stroke-width="4"/> <!-- Oil pipe -->
    <!-- Oil level sight gauge -->
    <rect x="135" y="38" width="6" height="16" rx="2" fill="#3AC67D" opacity="0.8"/>

    <!-- High-Voltage Ceramic Bushings & Arcing Horns (3 Phases) -->
    <!-- Bushing 1 -->
    <g transform="translate(50, -45)">
      <polygon points="12,0 18,0 24,65 6,65" fill="url(#bushingGrad)" stroke="#5c330a" stroke-width="1"/>
      <!-- Ceramic sheds / discs -->
      <ellipse cx="15" cy="18" rx="12" ry="4" fill="#a16207"/>
      <ellipse cx="15" cy="32" rx="14" ry="4.5" fill="#a16207"/>
      <ellipse cx="15" cy="48" rx="16" ry="5" fill="#a16207"/>
      <!-- Conductor terminal rod -->
      <line x1="15" y1="-10" x2="15" y2="5" stroke="#fef08a" stroke-width="2.5" filter="url(#coronaGlow)"/>
    </g>

    <!-- Bushing 2 (Center) -->
    <g transform="translate(105, -55)">
      <polygon points="12,0 18,0 24,65 6,65" fill="url(#bushingGrad)" stroke="#5c330a" stroke-width="1"/>
      <ellipse cx="15" cy="18" rx="12" ry="4" fill="#a16207"/>
      <ellipse cx="15" cy="32" rx="14" ry="4.5" fill="#a16207"/>
      <ellipse cx="15" cy="48" rx="16" ry="5" fill="#a16207"/>
      <line x1="15" y1="-10" x2="15" y2="5" stroke="#fef08a" stroke-width="2.5" filter="url(#coronaGlow)"/>
    </g>

    <!-- Bushing 3 -->
    <g transform="translate(160, -45)">
      <polygon points="12,0 18,0 24,65 6,65" fill="url(#bushingGrad)" stroke="#5c330a" stroke-width="1"/>
      <ellipse cx="15" cy="18" rx="12" ry="4" fill="#a16207"/>
      <ellipse cx="15" cy="32" rx="14" ry="4.5" fill="#a16207"/>
      <ellipse cx="15" cy="48" rx="16" ry="5" fill="#a16207"/>
      <line x1="15" y1="-10" x2="15" y2="5" stroke="#fef08a" stroke-width="2.5" filter="url(#coronaGlow)"/>
    </g>

    <!-- Rating Plate / Nexovolt Monitoring Telemetry Badge -->
    <rect x="40" y="110" width="160" height="60" rx="4" fill="#0b131c" stroke="#189ED6" stroke-width="1.2"/>
    <text x="50" y="125" fill="#189ED6" font-family="system-ui, sans-serif" font-size="9" font-weight="800">PRIMARY SUBSTATION TX-01</text>
    <text x="50" y="138" fill="#edf5ff" font-family="system-ui, monospace" font-size="8">RATING: 2500 kVA | Dyn11</text>
    <text x="50" y="149" fill="#27BCAE" font-family="system-ui, monospace" font-size="8">V: 33kV / 415V | Z%: 6.25%</text>
    <text x="50" y="160" fill="#3AC67D" font-family="system-ui, monospace" font-size="8">HEALTH: ONLINE · THD-V 1.6%</text>
  </g>

  <!-- High-voltage connection lines -->
  <line x1="245" y1="95" x2="200" y2="60" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
  <line x1="300" y1="85" x2="300" y2="40" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
  <line x1="355" y1="95" x2="400" y2="60" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
</svg>