<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2c3b"/>
      <stop offset="50%" stop-color="#16202c"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="heatsinkFins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="vfdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="300" cy="430" rx="230" ry="12" fill="#000000" opacity="0.6"/>

  <!-- VFD Industrial Chassis -->
  <rect x="130" y="25" width="340" height="390" rx="14" fill="url(#chassisGrad)" stroke="#32465e" stroke-width="2.5"/>
  
  <!-- Rear Heavy Aluminum Extruded Heatsink (Visible on top/sides) -->
  <g fill="url(#heatsinkFins)">
    <rect x="120" y="45" width="10" height="330" rx="2"/>
    <rect x="470" y="45" width="10" height="330" rx="2"/>
  </g>

  <!-- Top Fan Exhaust Shrouds -->
  <rect x="180" y="14" width="100" height="12" rx="3" fill="#0d141e" stroke="#253549" stroke-width="1.5"/>
  <rect x="320" y="14" width="100" height="12" rx="3" fill="#0d141e" stroke="#253549" stroke-width="1.5"/>

  <!-- VFD Keypad / Digital Operator Panel (BOP) -->
  <rect x="160" y="45" width="280" height="95" rx="8" fill="#090f17" stroke="#27BCAE" stroke-width="1.5"/>
  
  <!-- LED 7-Segment Display -->
  <rect x="175" y="55" width="140" height="42" rx="4" fill="#02060a" stroke="#189ED6" stroke-width="1"/>
  <text x="188" y="85" fill="#3AC67D" font-family="system-ui, monospace" font-size="24" font-weight="900" letter-spacing="2" filter="url(#vfdGlow)">50.0<tspan font-size="14">Hz</tspan></text>
  <text x="270" y="70" fill="#27BCAE" font-family="system-ui, monospace" font-size="8">RUN [FWD]</text>
  <text x="270" y="82" fill="#9db0c5" font-family="system-ui, monospace" font-size="8">I: 142.5 A</text>
  <text x="270" y="92" fill="#ef4444" font-family="system-ui, monospace" font-size="7">THD-i: 38%</text>

  <!-- Operator Buttons -->
  <g transform="translate(330, 55)">
    <!-- RUN button -->
    <rect x="0" y="0" width="38" height="24" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1"/>
    <text x="8" y="16" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="9" font-weight="900">RUN</text>

    <!-- STOP button -->
    <rect x="46" y="0" width="38" height="24" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="1"/>
    <text x="52" y="16" fill="#fef2f2" font-family="system-ui, sans-serif" font-size="9" font-weight="900">STOP</text>

    <!-- Navigation arrows -->
    <rect x="0" y="32" width="24" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="8" y="45" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">▲</text>
    <rect x="30" y="32" width="24" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="38" y="45" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">▼</text>
    <rect x="60" y="32" width="24" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="64" y="45" fill="#27BCAE" font-family="system-ui, sans-serif" font-size="8" font-weight="800">ENT</text>
  </g>

  <!-- Middle Section: Industrial Inverter PCB & Internal Architecture Cutaway -->
  <rect x="155" y="152" width="290" height="150" rx="6" fill="url(#pcbGrad)" stroke="#134e4a" stroke-width="1.5"/>
  <text x="170" y="172" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="800">6-PULSE DIODE RECTIFIER + PWM INVERTER</text>

  <!-- DC Bus Capacitors -->
  <g transform="translate(170, 185)">
    <!-- Cap 1 -->
    <rect x="0" y="0" width="38" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="6" y="8" width="26" height="54" rx="2" fill="#1e293b"/>
    <text x="8" y="38" fill="#94a3b8" font-family="system-ui, monospace" font-size="7">DC BUS</text>
    <text x="6" y="50" fill="#3AC67D" font-family="system-ui, monospace" font-size="7">560VDC</text>

    <!-- Cap 2 -->
    <rect x="46" y="0" width="38" height="70" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="52" y="8" width="26" height="54" rx="2" fill="#1e293b"/>
    <text x="54" y="38" fill="#94a3b8" font-family="system-ui, monospace" font-size="7">DC BUS</text>
    <text x="52" y="50" fill="#3AC67D" font-family="system-ui, monospace" font-size="7">560VDC</text>
  </g>

  <!-- IGBT Power Switches (Bridge) -->
  <g transform="translate(270, 185)">
    <rect x="0" y="0" width="160" height="70" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="800">FAST-SWITCHING IGBT BRIDGE</text>
    
    <!-- Pulse width modulation wave graphic -->
    <path d="M 12 55 L 20 55 L 20 30 L 26 30 L 26 55 L 34 55 L 34 25 L 44 25 L 44 55 L 50 55 L 50 20 L 64 20 L 64 55 L 72 55 L 72 25 L 82 25 L 82 55 L 90 55 L 90 30 L 98 30 L 98 55 L 106 55 L 106 38 L 112 38 L 112 55 L 148 55"
          fill="none" stroke="#27BCAE" stroke-width="1.5"/>
    <text x="12" y="65" fill="#94a3b8" font-family="system-ui, monospace" font-size="6">HIGH dv/dt HARMONIC GENERATION</text>
  </g>

  <!-- Bottom Power & Motor Terminals -->
  <rect x="155" y="315" width="290" height="85" rx="6" fill="#0b1118" stroke="#1f2c3d" stroke-width="1.5"/>
  
  <!-- Line Input (R, S, T) -->
  <g transform="translate(170, 328)">
    <text x="0" y="10" fill="#9db0c5" font-family="system-ui, sans-serif" font-size="8" font-weight="700">AC MAINS (3-PHASE)</text>
    <rect x="0" y="18" width="20" height="20" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="5" y="32" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="800">R</text>

    <rect x="28" y="18" width="20" height="20" rx="3" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="34" y="32" fill="#eab308" font-family="system-ui, sans-serif" font-size="9" font-weight="800">S</text>

    <rect x="56" y="18" width="20" height="20" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="62" y="32" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" font-weight="800">T</text>
  </g>

  <!-- Motor Output (U, V, W) -->
  <g transform="translate(320, 328)">
    <text x="0" y="10" fill="#9db0c5" font-family="system-ui, sans-serif" font-size="8" font-weight="700">TO MOTOR LOAD</text>
    <rect x="0" y="18" width="20" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="5" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">U</text>

    <rect x="28" y="18" width="20" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="34" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">V</text>

    <rect x="56" y="18" width="20" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="61" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">W</text>
  </g>
</svg>