<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16202c"/>
      <stop offset="60%" stop-color="#121a24"/>
      <stop offset="100%" stop-color="#0c121a"/>
    </linearGradient>
    <linearGradient id="capCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="reactorCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="reactorCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="capGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Floor reflection / drop shadow -->
  <ellipse cx="300" cy="435" rx="250" ry="12" fill="#000000" opacity="0.6"/>

  <!-- Main Enclosure -->
  <rect x="90" y="20" width="420" height="400" rx="14" fill="url(#panelGrad)" stroke="#2b3d52" stroke-width="2.5"/>
  <rect x="80" y="405" width="440" height="18" rx="4" fill="#0a0f16" stroke="#1d2938" stroke-width="2"/>

  <!-- Top APFC Intelligent Microprocessor Controller Unit -->
  <rect x="110" y="35" width="380" height="78" rx="8" fill="#0a121c" stroke="#25374d" stroke-width="1.5"/>
  
  <!-- Digital Screen for APFC Controller -->
  <rect x="130" y="44" width="180" height="60" rx="5" fill="#03080e" stroke="#27BCAE" stroke-width="1.2"/>
  <text x="142" y="60" fill="#27BCAE" font-family="system-ui, monospace" font-size="9" font-weight="800">AUTOMATIC PF CONTROLLER</text>
  <text x="142" y="74" fill="#edf5ff" font-family="system-ui, monospace" font-size="11" font-weight="900">PF: 0.992 <tspan fill="#3AC67D" font-size="9">(TARGET REACHED)</tspan></text>
  <text x="142" y="88" fill="#9db0c5" font-family="system-ui, monospace" font-size="8">STEPS ACTIVE: [1][2][3][4] - - -</text>
  <text x="142" y="98" fill="#189ED6" font-family="system-ui, monospace" font-size="8">TOTAL COMP: 250 kVAr</text>

  <!-- Step Status LED Matrix -->
  <g transform="translate(330, 48)">
    <text x="0" y="10" fill="#9db0c5" font-family="system-ui, sans-serif" font-size="8" font-weight="700">STAGE SWITCHING</text>
    <!-- Row of step LEDs -->
    <circle cx="8" cy="22" r="5" fill="#3AC67D" filter="url(#capGlow)"/>
    <circle cx="28" cy="22" r="5" fill="#3AC67D" filter="url(#capGlow)"/>
    <circle cx="48" cy="22" r="5" fill="#3AC67D" filter="url(#capGlow)"/>
    <circle cx="68" cy="22" r="5" fill="#3AC67D" filter="url(#capGlow)"/>
    <circle cx="88" cy="22" r="5" fill="#1e293b" stroke="#334155"/>
    <circle cx="108" cy="22" r="5" fill="#1e293b" stroke="#334155"/>
    
    <text x="5" y="37" fill="#64748b" font-family="system-ui, monospace" font-size="7">1</text>
    <text x="25" y="37" fill="#64748b" font-family="system-ui, monospace" font-size="7">2</text>
    <text x="45" y="37" fill="#64748b" font-family="system-ui, monospace" font-size="7">3</text>
    <text x="65" y="37" fill="#64748b" font-family="system-ui, monospace" font-size="7">4</text>
    <text x="85" y="37" fill="#64748b" font-family="system-ui, monospace" font-size="7">5</text>
    <text x="105" y="37" fill="#64748b" font-family="system-ui, monospace" font-size="7">6</text>
  </g>

  <!-- SECTION 1: DETUNED FILTER HARMONIC BLOCKING REACTORS (7% or 14% p-factor) -->
  <g transform="translate(110, 126)">
    <rect x="0" y="0" width="380" height="115" rx="8" fill="#0d141e" stroke="#223347" stroke-width="1.2"/>
    <text x="16" y="18" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="800">DETUNED HARMONIC BLOCKING REACTORS (7% 189Hz)</text>
    <text x="16" y="30" fill="#71869e" font-family="system-ui, sans-serif" font-size="8">Prevents Resonance &amp; Protects Capacitors from Non-Linear Inrush</text>

    <!-- 3 Heavy 3-Phase Copper Coil Cores -->
    <!-- Coil 1 -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="80" height="58" rx="6" fill="url(#reactorCore)" stroke="#475569" stroke-width="1"/>
      <rect x="10" y="8" width="60" height="42" rx="4" fill="url(#reactorCopper)" stroke="#9a3412" stroke-width="1"/>
      <!-- Coil windings representation -->
      <line x1="10" y1="18" x2="70" y2="18" stroke="#fdba74" stroke-width="1.5"/>
      <line x1="10" y1="28" x2="70" y2="28" stroke="#fdba74" stroke-width="1.5"/>
      <line x1="10" y1="38" x2="70" y2="38" stroke="#fdba74" stroke-width="1.5"/>
      <text x="24" y="55" fill="#ffedd5" font-family="system-ui, monospace" font-size="7" font-weight="800">PHASE R</text>
    </g>

    <!-- Coil 2 -->
    <g transform="translate(150, 40)">
      <rect x="0" y="0" width="80" height="58" rx="6" fill="url(#reactorCore)" stroke="#475569" stroke-width="1"/>
      <rect x="10" y="8" width="60" height="42" rx="4" fill="url(#reactorCopper)" stroke="#9a3412" stroke-width="1"/>
      <line x1="10" y1="18" x2="70" y2="18" stroke="#fdba74" stroke-width="1.5"/>
      <line x1="10" y1="28" x2="70" y2="28" stroke="#fdba74" stroke-width="1.5"/>
      <line x1="10" y1="38" x2="70" y2="38" stroke="#fdba74" stroke-width="1.5"/>
      <text x="24" y="55" fill="#ffedd5" font-family="system-ui, monospace" font-size="7" font-weight="800">PHASE Y</text>
    </g>

    <!-- Coil 3 -->
    <g transform="translate(270, 40)">
      <rect x="0" y="0" width="80" height="58" rx="6" fill="url(#reactorCore)" stroke="#475569" stroke-width="1"/>
      <rect x="10" y="8" width="60" height="42" rx="4" fill="url(#reactorCopper)" stroke="#9a3412" stroke-width="1"/>
      <line x1="10" y1="18" x2="70" y2="18" stroke="#fdba74" stroke-width="1.5"/>
      <line x1="10" y1="28" x2="70" y2="28" stroke="#fdba74" stroke-width="1.5"/>
      <line x1="10" y1="38" x2="70" y2="38" stroke="#fdba74" stroke-width="1.5"/>
      <text x="24" y="55" fill="#ffedd5" font-family="system-ui, monospace" font-size="7" font-weight="800">PHASE B</text>
    </g>
  </g>

  <!-- SECTION 2: HEAVY DUTY CYLINDRICAL CAPACITOR BANK -->
  <g transform="translate(110, 255)">
    <rect x="0" y="0" width="380" height="135" rx="8" fill="#0d141e" stroke="#223347" stroke-width="1.2"/>
    <text x="16" y="18" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="9" font-weight="800">HEAVY DUTY GAS/RESIN FILLED CAPACITOR CANISTERS</text>
    <text x="16" y="30" fill="#71869e" font-family="system-ui, sans-serif" font-size="8">Self-healing MPP Film | Overpressure Disconnector | 50 kVAr / 440V</text>

    <!-- 5 Heavy Duty Aluminium Cylinders -->
    <!-- Canister 1 -->
    <g transform="translate(25, 42)">
      <!-- Top terminal -->
      <ellipse cx="25" cy="6" rx="25" ry="6" fill="url(#capTop)" stroke="#475569" stroke-width="0.8"/>
      <!-- Body -->
      <rect x="0" y="6" width="50" height="68" fill="url(#capCylinder)"/>
      <ellipse cx="25" cy="74" rx="25" ry="6" fill="#334155"/>
      <!-- Spec Label -->
      <rect x="6" y="24" width="38" height="26" fill="#0f172a" opacity="0.85" rx="2"/>
      <text x="12" y="35" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="7" font-weight="800">50 kVAr</text>
      <text x="11" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="6">480V HD</text>
    </g>

    <!-- Canister 2 -->
    <g transform="translate(95, 42)">
      <ellipse cx="25" cy="6" rx="25" ry="6" fill="url(#capTop)" stroke="#475569" stroke-width="0.8"/>
      <rect x="0" y="6" width="50" height="68" fill="url(#capCylinder)"/>
      <ellipse cx="25" cy="74" rx="25" ry="6" fill="#334155"/>
      <rect x="6" y="24" width="38" height="26" fill="#0f172a" opacity="0.85" rx="2"/>
      <text x="12" y="35" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="7" font-weight="800">50 kVAr</text>
      <text x="11" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="6">480V HD</text>
    </g>

    <!-- Canister 3 -->
    <g transform="translate(165, 42)">
      <ellipse cx="25" cy="6" rx="25" ry="6" fill="url(#capTop)" stroke="#475569" stroke-width="0.8"/>
      <rect x="0" y="6" width="50" height="68" fill="url(#capCylinder)"/>
      <ellipse cx="25" cy="74" rx="25" ry="6" fill="#334155"/>
      <rect x="6" y="24" width="38" height="26" fill="#0f172a" opacity="0.85" rx="2"/>
      <text x="12" y="35" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="7" font-weight="800">50 kVAr</text>
      <text x="11" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="6">480V HD</text>
    </g>

    <!-- Canister 4 -->
    <g transform="translate(235, 42)">
      <ellipse cx="25" cy="6" rx="25" ry="6" fill="url(#capTop)" stroke="#475569" stroke-width="0.8"/>
      <rect x="0" y="6" width="50" height="68" fill="url(#capCylinder)"/>
      <ellipse cx="25" cy="74" rx="25" ry="6" fill="#334155"/>
      <rect x="6" y="24" width="38" height="26" fill="#0f172a" opacity="0.85" rx="2"/>
      <text x="12" y="35" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="7" font-weight="800">50 kVAr</text>
      <text x="11" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="6">480V HD</text>
    </g>

    <!-- Canister 5 -->
    <g transform="translate(305, 42)">
      <ellipse cx="25" cy="6" rx="25" ry="6" fill="url(#capTop)" stroke="#475569" stroke-width="0.8"/>
      <rect x="0" y="6" width="50" height="68" fill="url(#capCylinder)"/>
      <ellipse cx="25" cy="74" rx="25" ry="6" fill="#334155"/>
      <rect x="6" y="24" width="38" height="26" fill="#0f172a" opacity="0.85" rx="2"/>
      <text x="12" y="35" fill="#3AC67D" font-family="system-ui, sans-serif" font-size="7" font-weight="800">50 kVAr</text>
      <text x="11" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="6">480V HD</text>
    </g>
  </g>
</svg>